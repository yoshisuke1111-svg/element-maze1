const testScope='この管理者パネルは端末内のCPU検証専用です。公開オンライン対戦時にはサーバー認証が必要になります。';
function tile(id,klass=''){
 if(id==null)return '<span class="tile back">?</span>';
 const type=Y.type(id),honor=type>=27,suit=honor?'':Math.floor(type/9);
 const mark=honor?Y.HONORS[type-27]:String(type%9+1);
 const suffix=honor?'':Y.SUITS[suit];
 const red=Y.isRed(id)&&ui.settings.red;
 return `<span class="tile ${klass} ${honor?'honor':'suit'+suit} ${red?'red':''}" aria-label="${esc(Y.tileText(id))}"><span class="val">${mark}</span>${honor?'':`<span class="suit">${suffix}</span>`}</span>`;
}
const btn=(text,act,klass='secondary',extra='')=>`<button class="btn ${klass}" data-act="${act}" ${extra}>${text}</button>`;
function header(sub=''){
 return `<div class="header"><div class="brand"><span class="brand-symbol">🀄</span><span>夜雀 <span class="tiny">YONMA LAB</span></span></div><div class="top-actions">${ui.screen==='home'?'':`<button class="iconbtn" data-act="home">⌂ ホーム</button>`}</div></div>${sub?`<div class="crumb">ゲームセンター <span>›</span> ${sub}</div>`:''}`;
}
function menu(name,icon,tag,target,enabled=true){return `<button class="menu-tile" data-act="${target}" ${enabled?'':'disabled'}><span class="emoji">${icon}</span><strong>${name}</strong><span class="sub">${tag}</span></button>`;}
function home(){return `${header()}<section class="hero"><div class="eyebrow">CASINO & GAME NETWORK</div><h1>遊びたいゲームを、<br>ここから。</h1><p class="lead">無料ブラウザゲームセンター構想。現在は四人麻雀のCPU試作を先行公開。スマホで操作できるぞ。</p>${btn('カジノへ進む　→','casino','gold')}</section><h2 class="section-title">ゲームジャンル</h2><div class="menu-grid">${menu('カジノ','♠️','麻雀を試せる','casino')}${menu('心理戦','🌙','人狼：別プロジェクト','noop',false)}${menu('頭脳対決','♟️','将棋・オセロ：構想中','noop',false)}${menu('クイズ','🧩','対戦・協力：構想中','noop',false)}${menu('カードバトル','🐉','永続購入：構想中','noop',false)}${menu('協力脱出','🔐','ランダム謎解き：構想中','noop',false)}</div><p class="footer">試作版 v0.1 — 仮想コイン・オンラインアカウントはまだ未接続</p>`;}
function casino(){return `${header('カジノ')}<section class="hero" style="min-height:190px"><div class="eyebrow">THE CASINO</div><h1>カジノ</h1><p class="lead">牌を読み、流れを見極める。まずはCPUとの四人麻雀から始めるのじゃ。</p></section><div class="menu-grid">${menu('四人麻雀','🀄','CPU3人・管理者牌山検証','mahjong')}${menu('5枚ポーカー','♠️','別の試作版で実装済み','noop',false)}${menu('大富豪','👑','制作予定','noop',false)}${menu('ルーレット','🎡','制作予定','noop',false)}${menu('競馬もどき','🏇','制作予定','noop',false)}</div><div class="bottom-link">${btn('← ゲームセンターへ','home')}${btn('⚙ 管理者CPU設定','adminSettings','secondary small')}</div>`;}
function field(label,html){return `<div class="field"><label>${label}</label>${html}</div>`;}
function select(name,values){return `<select data-set="${name}">${values.map(x=>`<option value="${x[0]}" ${String(ui.settings[name])===String(x[0])?'selected':''}>${x[1]}</option>`).join('')}</select>`;}
function checkbox(label,name){return `<div class="field check"><input type="checkbox" id="c-${name}" data-set="${name}" ${ui.settings[name]?'checked':''}><label for="c-${name}">${label}</label></div>`;}
function localCheckbox(label,name){return `<div class="field check"><input type="checkbox" id="l-${name}" data-local="${name}" ${ui.settings.local[name]?'checked':''}><label for="l-${name}">${label}</label></div>`;}
function adminSettings(){return `${header('管理者 › CPU設定')}<div class="card"><h2>⚙ カジノCPU管理</h2><p class="note">管理者が固定の実力、または基準値±幅を指定する。今は一人用試作のため、誰でも開けるローカル検証画面じゃ。オンライン化の際は管理者認証が必要。</p><div class="form-grid">${field('CPUの実力の決め方',select('cpuMode',[["random","ランダム（基準±幅）"],["fixed","全CPU固定"]]))}${field('固定値／基準値',`<input type="number" min="1" max="100" inputmode="numeric" data-set="cpuCenter" value="${ui.settings.cpuCenter}">`)}${field('ランダム幅（±）',`<input type="number" min="0" max="50" inputmode="numeric" data-set="cpuRange" value="${ui.settings.cpuRange}">`)}</div><p class="warning">強さ1〜100は現時点では戦術の選択精度を調整する試作値で、本物のプロ級AIを保証する数値ではない。設定は次の新規対局から適用される。</p><div class="two-buttons">${btn('← カジノへ','casino')}${btn('麻雀の設定へ →','mahjong','gold')}</div></div>`;}
function mahjong(){return `${header('カジノ › 四人麻雀')}<div class="card"><h2 style="margin:0 0 9px">🀄 四人リーチ麻雀</h2><p class="note">あなたは東家から開始。CPU3人と東風戦または東南戦を遊べる、端末内で完結するテスト版じゃ。</p><div class="form-grid">${field('対局の長さ',select('length',[['east','東風戦'],['south','東南戦']]))}${field('飛びの有無',select('tobi',[[true,'飛びあり（0点未満で終了）'],[false,'飛びなし']]))}${checkbox('赤ドラを使用','red')}${checkbox('喰いタンあり','kuitan')}${checkbox('チー・ポンあり','allowCall')}${checkbox('ダブル役満（一部）','doubleYakuman')}</div><div class="setting-group"><p class="note">CPU実力：${ui.settings.cpuMode==='fixed'?ui.settings.cpuCenter:'基準'+ui.settings.cpuCenter+'±'+ui.settings.cpuRange}（管理者設定）　${btn('変更','adminSettings','small')}</p><h3 style="margin:0 0 9px;font-size:15px">ローカル役（任意）</h3><div class="form-grid">${localCheckbox('大車輪（清一色・筒子2〜8の七対子）','daisharin')}${localCheckbox('人和（第一巡目のロン）','renhou')}</div><p class="note">採用基準が統一されない役は、初期設定で無効。今回はこの2種類のみ試験実装。</p></div><div class="warning">現バージョンで<strong>カン、複数同時ロン、九種九牌・四風連打などの途中流局、流し満貫、細かなオーラス終了判定</strong>は未対応。点数計算は標準的な役を実装してテスト中で、公式の完全準拠版ではないぞ。</div><div class="two-buttons">${btn('← カジノへ','casino')}${btn('対局開始 →','start','gold')}</div></div><div class="card"><h3>管理者検証でできること</h3><p class="note">全員の手牌・捨て牌・牌山の順序を表示する。自分の牌と、CPUの牌または牌山内の好きな牌を交換できる。普通のオンライン対局では利用できないローカル試験機能じゃ。</p></div>`;}
function scoreboard(g){return `<div class="scoreboard">${g.players.map((p,i)=>`<div class="player ${g.current===i&&g.phase!=='result'?'current':''}"><div class="name">${i===g.dealer?'♛ ':''}${p.name}</div><div class="points">${fmt(p.score)}<small>点</small></div><div class="status">${seatName(g,i)}家 ${p.riichi?'・立直':''}${p.bot?'':'・本人'}</div></div>`).join('')}</div>`;}
function board(g){const dora=Array.from({length:g.kans+1},(_,i)=>g.dead[4+i*2]);return `<section class="board"><div class="board-head"><div><strong>${timeName(g)}</strong> <span class="tiny">${g.honba}本場・供託${g.kyoutaku}本</span></div><span>山残り ${g.live.length}枚</span></div><div class="river-grid">${g.players.map((p,i)=>`<div class="river"><div class="river-name"><span>${p.name}　${seatName(g,i)}</span><span>${p.river.length}枚</span></div><div class="tiles">${p.river.map(r=>tile(r.id,`river-tile ${r.called?'called':''}`)).join('')}</div>${p.melds.length?`<div class="seat-melds">${p.melds.map(m=>`<div class="meld">${m.tiles.map(id=>tile(id,'sm')).join('')}</div>`).join('')}</div>`:''}</div>`).join('')}</div><div class="center-tiles"><div class="meta"><span>ドラ表示</span><span>${dora.map(id=>tile(id,'sm')).join('')}</span></div><span class="tiny">${g.settings.allowCall?'チー・ポン可':'門前のみ'}</span></div></section>`;}
function myHand(g){const p=g.players[0];const drawn=g.current===0&&g.phase==='play'?p.drawn:null;
 let hand=p.hand.map((id,index)=>({id,index}));let last=drawn===null?null:hand.pop();hand.sort((a,b)=>Y.type(a.id)-Y.type(b.id)||(Y.isRed(a.id)?1:0)-(Y.isRed(b.id)?1:0));if(last)hand.push(last);
 const moves=ui.riichi?g.possibleRiichi():null;
 const interactive=g.phase==='play'&&g.current===0;
 return `<div class="hand-panel"><div class="handline"><span><strong>あなたの手牌</strong> ${p.riichi?'<span class="pill">立直</span>':''}</span><span class="tiny">${interactive?ui.riichi?'光っている牌を選んでリーチ':'牌をタップして捨てる':g.phase==='response'?'鳴き・ロンの確認':g.phase==='result'?'局終了':'CPUが思考中…'}</span></div><div class="hand-tiles">${hand.map(x=>`<button type="button" class="tile hand ${x.id===drawn?'drawn':''} ${moves?.includes(x.index)?'can-riichi':''}" data-act="discard" data-index="${x.index}" ${!interactive||(ui.riichi&&!moves.includes(x.index))?'disabled':''}>${tileInside(x.id)}</button>`).join('')}</div><div class="actions">${controls(g)}</div></div>`;}
function tileInside(id){const t=Y.type(id),honor=t>=27;return `<span class="val" style="${Y.isRed(id)&&ui.settings.red?'color:#c34a42':''}">${honor?Y.HONORS[t-27]:t%9+1}</span>${honor?'':`<span class="suit" style="${Math.floor(t/9)===1?'color:#bd514c':Math.floor(t/9)===2?'color:#357e5a':''}">${Y.SUITS[Math.floor(t/9)]}</span>`}`;}
function controls(g){if(g.phase==='result')return '';
 if(g.phase==='response'&&g.pending){const x=g.pending;
 if(x.kind==='ron')return btn('ロン！','ron','gold')+btn('見送る','pass');
 return `${x.pon?btn('ポン','pon','gold'):''}${x.chi.map((op,i)=>btn('チー '+op.map(Y.display).join('・'),'chi','secondary',`data-index="${i}"`)).join('')}${btn('パス','pass')}`;
 }
 if(g.current===0&&g.phase==='play'){
  const canTsumo=!!g.possibleTsumo(),riichi=g.possibleRiichi().length>0;
  return `${canTsumo?btn('ツモ！','tsumo','gold'):''}${riichi?btn(ui.riichi?'立直を取消':'リーチ','riichi',ui.riichi?'gold':'secondary'):''}<span class="tiny" style="align-self:center">${ui.riichi?'リーチしたい捨て牌を選択':g.players[0].riichi?'ツモ切りのみ':'手牌から捨て牌を選択'}</span>`;
 }
 return '<span class="note">他家の打牌を処理しているぞ…</span>';
}
function result(g){const r=g.result;if(!r)return '';
 if(r.type==='win'){
  let p=g.players[r.seat],s=r.score;
  return `<section class="result"><div class="eyebrow">HAND RESULT</div><h2>${p.name}　${r.tsumo?'ツモ':'ロン'}！</h2><div style="font-size:21px;font-weight:900">${s.yakuman?s.yakuman+'倍役満':s.han+'翻 '+s.fu+'符'}　${fmt(s.pay.total)}点</div><div class="yaku">${s.yaku.map(y=>`<span>${esc(y.name)} ${y.yakuman?'役満':y.han+'翻'}</span>`).join('')}</div><div class="events">${r.detail.map(esc).join('<br>')}</div>${resultBtns(g)}</section>`;
 }
 return `<section class="result"><div class="eyebrow">EXHAUSTIVE DRAW</div><h2>流局</h2><p>山の牌を引き終えたのじゃ。</p><div class="events">${r.detail.map(esc).join('<br>')}</div>${resultBtns(g)}</section>`;
}
function resultBtns(g){let ranks=[...g.players].sort((a,b)=>b.score-a.score);let scores=g.matchOver||g.result.matchEnd?`<h3>対局終了</h3><table class="rank-table">${ranks.map((p,i)=>`<tr><td>${i+1}位</td><td>${p.name}</td><td>${fmt(p.score)}点</td></tr>`).join('')}</table>`:'';
 return `${scores}<div class="two-buttons">${btn('新しく始める','restart')}${btn(g.matchOver||g.result.matchEnd?'対局終了':'次の局へ →','next','gold',g.matchOver||g.result.matchEnd?'disabled':'')}</div>`;}
function projected(g){const start=turnsAhead(g);return `<div class="admin-predict">${Array.from({length:4},(_,i)=>{let first=((i-start+4)%4);const id=g.live[first];return `<div class="prediction"><b>${g.players[i].name}</b>${id!==undefined?tile(id,'sm'):'—'}<small>${first+1}番目</small></div>`;}).join('')}</div><p class="tiny">※ この予測は鳴きがなく、通常順に進んだ場合じゃ。鳴き・流局・和了で順番が変わる。</p>`;}
function admin(g){let mine=g.players[0];const mineRows=mine.hand.map((id,i)=>`<button type="button" class="admin-tile ${ui.selected===i?'selected':''}" data-act="selectMine" data-index="${i}" title="自分の牌${i+1}">${tile(id,'sm')}</button>`).join('');
 const cpu=g.players.slice(1).map((p,i)=>`<div class="admin-row"><div class="meta"><b>${p.name}</b><span>実力 ${p.level}/100</span><span>${Y.shanten(Y.count(p.hand),p.melds.length)}シャンテン</span></div><div class="admin-hand">${p.hand.map((id,j)=>`<button type="button" class="admin-tile" data-act="swap" data-source="cpu${i+1}" data-index="${j}" ${ui.selected==null?'disabled':''}>${tile(id,'sm')}</button>`).join('')}</div><p class="tiny">鳴き：${p.melds.map(m=>m.kind==='chi'?'チー':'ポン').join('・')||'なし'} ／ リーチ：${p.riichi?'あり':'なし'}</p></div>`).join('');
 const wall=g.live.slice(0,ui.wallAll?g.live.length:32).map((id,i)=>`<div class="wall-item"><span class="index">${i+1}</span><button type="button" data-act="swap" data-source="wall" data-index="${i}" ${ui.selected==null?'disabled':''}>${tile(id,'sm')}</button></div>`).join('');
 return `<section class="admin"><h3>🛠 管理者検証モード</h3><p class="admin-help">${testScope}</p><h4>あなたの牌（まず交換元を1枚選択）</h4><div class="admin-hand">${mineRows}</div><p class="admin-help">${ui.selected==null?'① 自分の牌を1枚選ぶ':`① ${Y.tileText(mine.hand[ui.selected])} を選択中 → ② CPUの牌または牌山をタップして交換`}</p><h4>全プレイヤーの手牌</h4>${cpu}<h4>次のツモ予測（鳴きなしの順序）</h4>${projected(g)}<h4>牌山（左上からツモ順）</h4><div class="admin-wall">${wall}</div>${g.live.length>32?`<div style="margin-top:9px">${btn(ui.wallAll?'先頭32枚だけ表示':'残りの牌山も表示','wallAll','small')}</div>`:''}<div class="warning">管理者による牌交換は検証用チート操作じゃ。交換した局の結果は公式記録・ランキングに使わない設計を想定しておる。</div>${btn('管理者画面を閉じる','adminToggle','secondary block')}</section>`;
}
function table(g){return `${header('カジノ › 四人麻雀 › 対局')}<div class="meta"><span>あなた＋CPU3人</span><span>実力 ${g.settings.cpuMode==='fixed'?g.settings.cpuCenter:g.settings.cpuCenter+'±'+g.settings.cpuRange}</span><span>${g.settings.tobi?'飛びあり':'飛びなし'}</span><span>${g.settings.length==='east'?'東風戦':'東南戦'}</span></div>${scoreboard(g)}${board(g)}${g.phase==='result'?result(g):myHand(g)}<div class="events"><b>対局ログ</b><br>${g.events.slice(-4).reverse().map(esc).join('<br>')}</div><div class="bottom-link">${btn(ui.admin?'🔐 検証パネルを閉じる':'🛠 管理者検証パネル','adminToggle','secondary small')}${btn('新規対局','restart','ghost small')}</div>${ui.admin?admin(g):''}${ui.toast?`<div class="warning">${esc(ui.toast)}</div>`:''}<p class="footer">🀄 夜雀 v0.1 — オフラインCPU試作・端末内でのみ進行<br>カン / 複数ロン / 流し満貫 / 特殊流局は今後実装予定</p>`;}
function render(){let body=ui.screen==='home'?home():ui.screen==='casino'?casino():ui.screen==='mahjong'?mahjong():ui.screen==='adminSettings'?adminSettings():ui.game?table(ui.game):home();$('app').innerHTML=`<div class="shell">${body}</div>`;if(ui.screen==='table'&&ui.game)scheduleCPU();}
function scheduleCPU(){const g=ui.game;if(ui.scheduled||ui.admin||g.phase==='result'||g.phase==='response'||g.current===0)return;
 ui.scheduled=true;ui.timer=setTimeout(()=>{ui.scheduled=false;if(ui.screen!=='table'||ui.admin||!ui.game||ui.game!==g)return;
  try {if(g.phase==='play'&&g.active().bot){g.cpuPlay();ui.riichi=false;}else if(g.phase==='draw')g.draw();}catch(e){ui.toast='CPUエラー: '+String(e.message||e);console.error(e);ui.admin=true;}
  render();},520);
}
function storeSettings(){try{localStorage.setItem('yonma_lab_settings',JSON.stringify(ui.settings));}catch{}}
function goto(screen){clearTimeout(ui.timer);ui.scheduled=false;ui.screen=screen;ui.admin=false;ui.riichi=false;ui.toast='';render();window.scrollTo(0,0);}
$('app').addEventListener('change',e=>{let field=e.target;
 if(field.dataset.set){let key=field.dataset.set,v=field.type==='checkbox'?field.checked:field.type==='number'?Number(field.value):field.value;
  if(key==='tobi')v=v==='true';if(key==='cpuCenter')v=Math.min(100,Math.max(1,Number(v)||60));if(key==='cpuRange')v=Math.min(50,Math.max(0,Number(v)||0));ui.settings[key]=v;storeSettings();}
 if(field.dataset.local){ui.settings.local[field.dataset.local]=field.checked;storeSettings();}
});
$('app').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const action=b.dataset.act,g=ui.game;
 try{
  if(['home','casino','mahjong','adminSettings'].includes(action)){goto(action);return;}
  if(action==='start'||action==='restart'){ui.game=new Y.Game(JSON.parse(JSON.stringify(ui.settings)));ui.screen='table';ui.admin=false;ui.selected=null;ui.riichi=false;ui.toast='';window.scrollTo(0,0);render();return;}
  if(!g)return;
  if(action==='discard'){let idx=Number(b.dataset.index);if(!g.discard(idx,ui.riichi))ui.toast='今はその牌を捨てられないぞ。';ui.riichi=false;}
  if(action==='riichi'){ui.riichi=!ui.riichi;}
  if(action==='tsumo'){g.tsumo();ui.riichi=false;}
  if(action==='ron'){g.respond('ron');}
  if(action==='pass'){g.respond('pass');}
  if(action==='pon'){g.respond('pon');}
  if(action==='chi'){g.respond('chi',Number(b.dataset.index));}
  if(action==='next'){if(!g.nextHand())ui.toast=g.matchOver?'対局終了じゃ。新しく始められるぞ。':'';ui.riichi=false;}
  if(action==='adminToggle'){ui.admin=!ui.admin;ui.selected=null;}
  if(action==='wallAll'){ui.wallAll=!ui.wallAll;}
  if(action==='selectMine'){ui.selected=ui.selected===Number(b.dataset.index)?null:Number(b.dataset.index);}
  if(action==='swap'){if(g.swapOwnWith(b.dataset.source,Number(b.dataset.index),ui.selected)){ui.selected=null;ui.toast='牌を交換したぞ（この対局の検証記録）。';}else ui.toast='牌を交換できない局面じゃ。';}
  render();
 }catch(err){console.error(err);ui.toast=String(err?.message||err);render();}
});
render();
window.YonmaAppDebug={ui,render,goto};
})();

</script>
<script>
/* YONMA v0.2: mobile table and private local admin sandbox UI. */
(function(){
'use strict';
const debug=window.YonmaAppDebug,ui=debug.ui,Y=window.Yonma,root=document.getElementById('app');
if(!debug||!Y||!root)return;
let hub=false, chosen=null, loopStarted=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const glyph=id=>{
 const t=Y.type(id);
 return String.fromCodePoint(t<9?0x1f007+t:t<18?0x1f019+t-9:t<27?0x1f010+t-18:0x1f000+t-27);
};
const tTile=(id,cls='')=>{
 const t=Y.type(id),hon=t>=27;
 const label=hon?`<strong class="mini-honor">${esc(Y.HONORS[t-27])}</strong>`:`<strong class="mini-num">${t%9+1}</strong><small class="mini-suit">${esc(Y.SUITS[Math.floor(t/9)])}</small>`;
 return `<span class="m-tile ${cls} ${Y.isRed(id)?'is-red':''}" title="${esc(Y.tileText(id))}">${label}</span>`;
};
function convertTiles(el){
 for(const val of el.querySelectorAll('.tile .val:not(.glyph)')){
  const suit=val.parentElement.querySelector('.suit')?.textContent?.trim()||'';
  const v=val.textContent.trim();let code=null;
  if(suit==='萬'&&/^\d$/.test(v))code=0x1f007+Number(v)-1;
  if(suit==='筒'&&/^\d$/.test(v))code=0x1f019+Number(v)-1;
  if(suit==='索'&&/^\d$/.test(v))code=0x1f010+Number(v)-1;
  const honors={'東':0x1f000,'南':0x1f001,'西':0x1f002,'北':0x1f003,'中':0x1f004,'發':0x1f005,'白':0x1f006};
  if(code==null)code=honors[v];
  if(code!=null){val.textContent=String.fromCodePoint(code);val.classList.add('glyph');val.parentElement.title=(v+(suit||''));}
 }
}
function hubHTML(){
 const g=ui.game;
 return `<div class="shell v02-shell"><div class="header"><div class="brand">🀄 <span>夜雀 <small>ADMIN STUDIO</small></span></div></div><div class="v02-head"><span class="v02-kicker">LOCAL TEST CONTROL</span><h1>管理者検証センター</h1><p>CPUだけの対局を観察し、牌山や全員の手牌を確認するための開発用画面。<strong>このHTML版にはログイン認証はなく、実際の公開対戦管理者画面ではない。</strong></p></div><div class="control-grid"><button data-v02="watch" class="control-tile"><span>👁</span><b>CPU 4人の対局を観戦</b><small>全員の手牌・ツモ順・自動進行</small></button><button data-v02="inspect" class="control-tile"><span>🀄</span><b>${g&&!g.allCpu?'今の対局を検証':'検証用対局を始める'}</b><small>牌山・全員の手牌・牌交換</small></button><button data-v02="cpuSettings" class="control-tile"><span>⚙</span><b>CPUの思考設定</b><small>固定値または60±10など</small></button></div><p class="v02-notice">管理者による牌交換は一般の対局ログには表示せず、非公開の操作履歴に記録する。将来の掛け金あり対人戦では、こうした操作を禁止するか、検証卓であることを参加者に明示する必要がある。</p><button class="v02-back" data-v02="casino">← カジノへ戻る</button></div>`;
}
function watcherPanel(g){
 const speed=ui.watchSpeed||1;
 const hs=g.players.map((p,i)=>`<div class="watch-player ${g.current===i&&g.phase!=='result'?'watch-now':''}"><div class="watch-person"><b>${esc(p.name)}</b><span>${p.score.toLocaleString()}点　${i===g.dealer?'親　':''}${p.riichi?'立直':''}</span></div><div class="watch-tiles">${p.hand.map(id=>tTile(id)).join('')}${p.melds.map(m=>`<span class="watch-meld">${m.tiles.map(id=>tTile(id)).join('')}</span>`).join('')}</div></div>`).join('');
 const who=g.phase==='draw'?g.current:g.phase==='play'?g.current:(g.lastDiscard?.seat+1)%4||0;
 const next=g.live.slice(0,5).map((id,i)=>`<span class="watch-next"><small>${i+1}</small>${tTile(id)}</span>`).join('');
 return `<section class="watch-panel"><div class="watch-toolbar"><div><span class="v02-kicker">CPU VS CPU</span><h3>4人の対局を観戦</h3></div><span class="watch-label">${esc(g.players[who]?.name||'')}の手番</span></div><div class="watch-controls"><button data-v02="pause" class="btn small ${ui.watchPaused?'gold':'secondary'}">${ui.watchPaused?'▶ 再開':'Ⅱ 一時停止'}</button><button data-v02="step" class="btn small secondary">⏭ 1手進める</button><button data-v02="speed" class="btn small secondary">速度 ×${speed}</button><button data-v02="hub" class="btn small secondary">終了</button></div><div class="watch-hands">${hs}</div><div class="watch-nextline"><b>次のツモ（鳴きなしの場合）</b><div class="watch-nexts">${next||'牌山がない'}</div><small>表示は現在の牌山の順序。カン・鳴き・アガリで順序は変わる。</small></div><div class="watch-audit"><b>非公開の操作履歴</b>：${(g.adminAudit||[]).length}件</div></section>`;
}
function enhance(){
 const shell=root.querySelector('.shell');if(!shell||shell.dataset.v02Enhanced==='1')return;
 shell.dataset.v02Enhanced='1';shell.classList.add('v02-shell');
 document.title='夜雀 | 麻雀 v0.2';
 if(hub&&ui.screen==='casino'){root.innerHTML=hubHTML();root.firstElementChild.dataset.v02Enhanced='1';return;}
 if(ui.screen==='mahjong'){
  const warn=shell.querySelector('.warning');if(warn)warn.innerHTML='<b>試験対応：</b>暗槓・加槓・大明槓を追加。嶺上開花は判定。<br>槍槓・四開槓流局・複数ロン・九種九牌などの細かい規則はまだ未対応で、点数計算は引き続き検証中。';
 }
 if(ui.screen==='casino'){
  const slot=shell.querySelector('.bottom-link');if(slot){const b=document.createElement('button');b.type='button';b.className='btn gold admin-entry';b.dataset.v02='hub';b.textContent='◈ 管理者検証センター';slot.after(b);}
 }
 if(ui.screen!=='table'||!ui.game)return;
 const g=ui.game;
 shell.classList.add('game-shell');
 if(ui.watch)shell.classList.add('watchmode');
 if(ui.inspect)shell.classList.add('inspectmode');
 convertTiles(shell);
 const board=shell.querySelector('.board');
 if(board){
  const banner=document.createElement('div');banner.className='table-banner';banner.innerHTML=`<span class="light-dot"></span><b>${g.wind===0?'東':'南'}${g.kyoku+1}局</b><span>${g.honba}本場</span><em>${g.live.length}枚</em>`;
  board.prepend(banner);
  const rivers=board.querySelectorAll('.river');
  rivers.forEach((e,i)=>{
   e.classList.add('seat-'+i);
   const backs=document.createElement('div');backs.className='backs-row';
   if(!ui.watch&&i>0){const remaining=g.players[i].hand.length;backs.innerHTML=Array(Math.min(remaining,8)).fill('<i></i>').join('')+`<span>${remaining}枚</span>`;e.appendChild(backs);}
  });
 }
 const hand=shell.querySelector('.hand-panel');
 if(hand){
  if(!ui.watch){
   const actions=hand.querySelector('.actions');
   if(actions){
    if(g.phase==='play'&&g.current===0&&typeof g.possibleKans==='function')for(const k of g.possibleKans()){
     const b=document.createElement('button');b.className='btn gold';b.dataset.v02='kan';b.dataset.kind=k.kind;b.dataset.type=k.t;
     b.textContent=(k.kind==='ankan'?'暗槓 ':'加槓 ')+Y.display(k.t);actions.prepend(b);
    }
    if(g.phase==='response'&&g.pending?.kind==='call'&&g.pending.kan){const b=document.createElement('button');b.className='btn gold';b.dataset.v02='daiminkan';b.textContent='カン（大明槓）';actions.prepend(b);}
   }
   const line=hand.querySelector('.handline');
   const msg=document.createElement('div');msg.className='discard-guide';
   const interactive=g.current===0&&g.phase==='play';
   msg.innerHTML=`<span>${interactive?'牌を選択してから「打牌」を押す':'相手の手番を処理中'}</span>${interactive?`<button type="button" class="btn gold small" data-v02="discardConfirm" ${chosen==null?'disabled':''}>${ui.riichi?'立直して打牌':'選択した牌を打牌'}</button>`:''}`;
   line.after(msg);
   for(const b of hand.querySelectorAll('[data-act="discard"]')){if(chosen!==null&&Number(b.dataset.index)===chosen)b.classList.add('is-chosen');}
  }
 }
 // The local administrator is entered via the separate control centre,
 // never via a visible button on the ordinary player table.
 const toggle=shell.querySelector('.bottom-link [data-act="adminToggle"]');if(toggle)toggle.remove();
 const foot=shell.querySelector('.bottom-link');
 if(foot){const back=document.createElement('button');back.className='v02-back';back.dataset.v02=ui.watch||ui.inspect?'hub':'casino';back.textContent=ui.watch||ui.inspect?'← 管理者センター':'← カジノへ';foot.prepend(back);}
 const footer=shell.querySelector('.footer');if(footer)footer.innerHTML='🀄 夜雀 v0.2 — オフラインCPU試作／端末内のみで進行<br>カン（暗槓・加槓・大明槓）試験実装・公開オンライン対戦は未実装';
 if(ui.watch){
  const panel=document.createElement('div');panel.innerHTML=watcherPanel(g);
  board?.after(panel.firstElementChild);
 }
 if(ui.inspect){
  const admin=shell.querySelector('.admin');
  if(admin){
   const p=document.createElement('div');p.className='private-audit';p.innerHTML=`<h4>非公開の操作履歴</h4>${(g.adminAudit||[]).length?(g.adminAudit||[]).slice(-8).reverse().map(x=>`<div>操作 #${x.seq}　${esc(x.old)} ⇄ ${esc(x.to)}</div>`).join(''):'<small>まだ変更はない</small>'}`;admin.appendChild(p);
   const close=admin.querySelector('[data-act="adminToggle"]');if(close){close.dataset.v02='hub';delete close.dataset.act;close.textContent='管理者センターへ戻る';}
  }
 }
}
const observer=new MutationObserver(()=>enhance());observer.observe(root,{childList:true,subtree:false});enhance();
function render(){debug.render();}
function showHub(){
 hub=true;ui.watch=false;ui.inspect=false;ui.watchPaused=true;ui.admin=false;ui.toast='';chosen=null;
 clearTimeout(ui.timer);ui.scheduled=false;
 debug.goto('casino');enhance();
}
function beginWatch(){
 hub=false;chosen=null;ui.game=new Y.Game({...ui.settings,allCpu:true});ui.screen='table';ui.admin=true;ui.watch=true;ui.inspect=false;ui.watchPaused=false;ui.watchSpeed=1;ui.toast='';
 clearTimeout(ui.timer);ui.scheduled=false;render();startLoop();
}
function beginInspect(){
 hub=false;chosen=null;if(!ui.game||ui.game.allCpu)ui.game=new Y.Game({...ui.settings,allCpu:false});
 ui.screen='table';ui.admin=true;ui.watch=false;ui.inspect=true;ui.toast='';
 clearTimeout(ui.timer);ui.scheduled=false;render();
}
function step(){
 if(!ui.watch||ui.screen!=='table'||!ui.game)return;
 const g=ui.game;
 try{
  if(g.phase==='result'){
   if(g.matchOver||!g.nextHand()){ui.watchPaused=true;return;}
  }else if(g.phase==='play'&&g.active().bot)g.cpuPlay();
  else if(g.phase==='response'&&g.pending)g.respond('pass');
  else if(g.phase==='draw')g.draw();
 }catch(e){console.error(e);ui.watchPaused=true;ui.toast='観戦エラー: '+String(e.message||e);}
 render();
}
function startLoop(){
 if(loopStarted)return;loopStarted=true;
 function go(){
  if(ui.watch&&ui.screen==='table'&&!ui.watchPaused)step();
  setTimeout(go,ui.watchSpeed===8?105:ui.watchSpeed===4?210:850);
 }
 setTimeout(go,850);
}
root.addEventListener('click',e=>{
 const el=e.target.closest('[data-v02]');
 if(el){
  e.preventDefault();e.stopImmediatePropagation();
  const act=el.dataset.v02;
  if(act==='hub')showHub();
  if(act==='casino'){hub=false;ui.watch=false;ui.inspect=false;ui.admin=false;ui.toast='';debug.goto('casino');}
  if(act==='watch')beginWatch();
  if(act==='inspect')beginInspect();
  if(act==='cpuSettings'){hub=false;ui.watch=false;debug.goto('adminSettings');}
  if(act==='pause'){ui.watchPaused=!ui.watchPaused;render();}
  if(act==='speed'){ui.watchSpeed=({1:4,4:8,8:1})[ui.watchSpeed||1];render();}
  if(act==='step'){ui.watchPaused=true;step();}
  if(act==='kan'){const g=ui.game;if(g&&g.kan(el.dataset.kind,Number(el.dataset.type))){chosen=null;render();}}
  if(act==='daiminkan'){if(ui.game?.respond('kan'))render();}
  if(act==='discardConfirm'){
   const g=ui.game;if(g&&chosen!==null){if(!g.discard(chosen,ui.riichi))ui.toast='今はその牌を捨てられないぞ。';chosen=null;ui.riichi=false;render();}
  }
  return;
 }
 const original=e.target.closest('[data-act]');
 if(original?.dataset.act==='discard'&&!ui.watch){
  e.preventDefault();e.stopImmediatePropagation();
  const g=ui.game,idx=Number(original.dataset.index);
  if(!g||g.current!==0||g.phase!=='play'||original.disabled)return;
  if(ui.riichi&&!g.possibleRiichi().includes(idx))return;
  if(chosen===idx){if(!g.discard(chosen,ui.riichi))ui.toast='打牌できない局面じゃ。';chosen=null;ui.riichi=false;render();}
  else{chosen=idx;render();}
  return;
 }
 if(original&&['start','restart','home','casino','mahjong'].includes(original.dataset.act)){
  hub=false;ui.watch=false;ui.inspect=false;ui.watchPaused=true;chosen=null;
 }
 if(original?.dataset.act==='adminToggle'&&!ui.inspect){
  e.preventDefault();e.stopImmediatePropagation();return;
 }
},true);
window.YonmaV02={openHub:showHub,watch:beginWatch,inspect:beginInspect,step,enhance};
})();

</script>
