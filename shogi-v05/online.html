 }).join('')+'</div>'+arrow()+(done?'<div class="board-result-overlay" role="status"><div class="board-result-inner"><div class="board-result-heading">'+(winner===0?'引き分け':winner===side?'勝利':'敗北')+'</div><div class="board-result-detail">'+esc(reason)+'</div></div></div>':'')+'</div></div>';
}
function hand(who,active){
 const h=state.hands[who]||{},parts=E.TYPES.filter(t=>h[t]>0);
 return '<div class="hands">'+(parts.length?parts.map(t=>'<button type="button" class="hand-piece '+(selected?.type==='hand'&&selected.t===t?'selected':'')+'" data-act="hand" data-piece="'+t+'" '+(active&&linked&&!done&&!pending&&state.turn===side?'':'disabled')+'><span class="hand-koma" aria-hidden="true">'+E.NAMES[t]+'</span><span class="hand-caption">'+E.NAMES[t]+'</span><em>×'+h[t]+'</em></button>').join(''):'<span class="empty-label">持ち駒なし</span>')+'</div>';
}
function player(who){
 const mine=who===side,pname=mine?name:role==='host'?guestName:hostName;
 return '<div class="player-panel"><div class="avatar">'+(mine?'自':'対')+'</div><div class="player-meta"><div class="player-name">'+esc(pname)+' <span class="dim">'+(who===1?'先手':'後手')+'</span></div><div class="player-title">'+(mine?'あなた':'対局相手')+'</div></div>'+
 (clockLimit>0?'<span class="shogi-clock '+(state.turn===who&&!done?'active':'')+'" data-clock-side="'+who+'">'+clockFormat(clockShow(who))+'</span>':'')+
 (!done&&state.turn===who?'<span class="status-pill '+(E.inCheck(state,who)?'check':'')+'">'+(E.inCheck(state,who)?'王手':'手番')+'</span>':'')+'</div>';
}
function waiting(){
 return '<div class="online-room"><section class="panel"><h2 class="panel-title">'+(role==='host'?'対局相手を待っています':'対局室に接続中です')+'</h2><div class="room-status">'+esc(notice)+'</div>'+
 (failure?'<div class="room-status problem">'+esc(failure)+'</div>':'')+
 '<p class="room-sub">部屋コード</p><p class="room-code">'+esc(room)+'</p>'+(clockLimit?'<p class="room-sub">持ち時間：各'+clockLimit+'分</p>':'<p class="room-sub">持ち時間：なし</p>')+
 (role==='host'?'<input id="room-code-display" readonly class="room-link" value="'+esc(room)+'"><div class="room-inline"><button class="btn" data-act="copy">コードをコピー</button><button class="btn secondary" data-act="back">コードを変更</button></div>':
 '<div class="room-inline"><button class="btn" data-act="reconnect">再接続する</button><button class="btn secondary" data-act="back">戻る</button></div>')+
 '<div class="online-foot">ほかの人は「部屋に参加」で同じコードを入力してください。部屋主がページを閉じると対局室は終了します。</div></section></div>';
}
function game(){
 const other=-side,subtitle=done?(winner===0?'引き分け':winner===side?'あなたの勝ち':'あなたの負け'):!linked?'接続が切れています':pending?'指し手を送信しています…':state.turn===side?'あなたの手番':'相手の手番';
 const l=last?.side!==side?last:null;
 return '<div class="online-game"><section class="online-board"><div class="turn-head"><div><div class="eyebrow">対局 · '+state.ply+'手</div><div class="turn-line">'+esc(subtitle)+'</div></div><button class="btn small secondary" data-act="help">遊び方</button></div>'+
 '<div class="top-player">'+player(other)+hand(other,false)+'</div>'+board()+'<div class="bottom-player">'+player(side)+hand(side,true)+'</div>'+
 '<div class="move-info">'+(l?'<div class="move-info-icon">↗</div><div><div class="move-info-label">相手の直前の一手</div><div class="move-info-main">'+esc(l.text)+' <span class="move-coords">'+esc(coord(l.from))+' → '+esc(coord(l.to))+'</span></div></div>':'<div class="room-sub">相手の指し手は盤上の色と矢印で分かります。</div>')+'</div>'+
 (done?'<section class="panel end-panel"><div class="result-big">'+(winner===0?'引き分け':winner===side?'勝利':'敗北')+'</div><p>'+esc(reason)+'</p><button class="btn wide" data-act="rematch">'+(role==='host'?'もう一局':'再戦を希望する')+'</button></section>':'')+
 '<div class="room-inline"><button class="btn secondary" data-act="resign" '+(!linked||done?'disabled':'')+'>投了する</button><button class="btn ghost" data-act="back">部屋を退出</button></div></section>'+
 '<aside class="online-side"><section class="panel"><h3 class="panel-title">対局室の情報</h3><div class="room-status">'+esc(notice||'接続中')+'</div>'+
 (failure?'<div class="room-status problem">'+esc(failure)+'</div>':'')+
 '<div class="detail-row"><span>接続</span><strong>'+(linked?'オンライン':'切断')+'</strong></div><div class="detail-row"><span>手番</span><strong>'+(side===1?'先手':'後手')+'</strong></div><div class="detail-row"><span>持ち時間</span><strong>'+(clockLimit?clockLimit+'分 / 人':'なし')+'</strong></div>'+
 (role==='host'?'<label class="hint">部屋コード</label><input id="room-code-display" readonly class="room-link" value="'+esc(room)+'"><button class="btn wide secondary" data-act="copy">コードをコピー</button>':
 '<div class="detail-row"><span>部屋コード</span><strong>'+esc(room)+'</strong></div><button class="btn wide secondary" data-act="reconnect" '+(linked?'disabled':'')+'>再接続する</button>')+
 '</section><section class="panel"><h3 class="panel-title">棋譜</h3><div class="room-record">'+(logs.length?logs.slice(-80).map((o,i)=>'<div>'+(logs.length-Math.min(logs.length,80)+i+1)+'. '+esc(o.text)+(o.gaveCheck?' 王手':'')+'</div>').join(''):'<div>まだ指し手はありません。</div>')+'</div></section><p class="room-sub">通信回線や端末によっては接続できない場合があります。対局中は部屋主のページを開いたままにしてください。</p></aside></div>';
}
function overlay(){
 if(promotion)return '<div class="modal-backdrop"><div class="modal"><h2>この駒を成りますか？</h2><div class="actions"><button class="btn" data-act="promotion" data-value="yes">成る</button><button class="btn secondary" data-act="promotion" data-value="no">成らない</button></div></div></div>';
 if(modal==='resign')return '<div class="modal-backdrop"><div class="modal"><h2>投了しますか？</h2><div class="actions"><button class="btn danger" data-act="confirm-resign">投了する</button><button class="btn secondary" data-act="close">戻る</button></div></div></div>';
 if(modal==='help')return '<div class="modal-backdrop"><div class="modal"><h2>フリー対局の遊び方</h2><p class="help-list">駒をタップし、光る移動先をタップします。成りは「成る／成らない」を選択します。取った駒は持ち駒として打てます。相手の着手は矢印で表示されます。</p><p class="hint">部屋主がページを閉じると終了します。切断した場合は同じURLを開いて再入室してください。</p><button class="btn wide" data-act="close">対局に戻る</button></div></div>';
 return '';
}
function render(){
 const y=scrollY;
 root.innerHTML='<div class="app-shell"><header class="site-header"><div class="brand"><div class="monogram">棋</div><div><div class="brand-name">将棋</div><div class="brand-caption">オンライン対局</div></div></div><button class="btn small secondary" data-act="back">戻る</button></header><main>'+
 (view==='home'?'<div class="online-home"><h1 class="page-heading">オンライン対局</h1><p class="page-lead">部屋主がコードを決めて作成し、参加者は同じコードで入室します。</p><section class="panel"><h2 class="panel-title">部屋を作る</h2><label class="hint" for="nickname">表示名（任意）</label><input id="nickname" maxlength="20" value="'+esc(name)+'"><label class="hint" for="create-code">部屋コード（3〜16文字）</label><input id="create-code" class="room-code-entry" maxlength="40" placeholder="例：放課後-1" autocapitalize="characters"><p class="hint">部屋主が先手、参加者が後手になります。</p><button class="btn wide" data-act="create">部屋を作成</button></section><section class="panel"><h2 class="panel-title">部屋に参加</h2><label class="hint" for="join-code">部屋コード</label><input id="join-code" class="room-code-entry" maxlength="40" placeholder="コードを入力" autocapitalize="characters"><button class="btn wide secondary" data-act="join" style="margin-top:12px">コードで入室</button></section><p id="room-error" class="room-error" role="alert"></p><a class="btn secondary" href="../shogi-v04/" style="display:block;text-align:center;text-decoration:none">CPU対局を遊ぶ</a></div>':
 (!linked?waiting():game()))+'</main></div>'+overlay();
 if(scrollY!==y)scrollTo(0,y);
}
function resign(){
 if(!linked||done)return;modal='';
 if(role==='host'){settleClock();if(done)return;done=true;winner=-1;reason='部屋主が投了しました。';sendSnapshot();render();}
 else {try{conn.send({t:'resign'});}catch{}notice='投了を送信しました。';render();}
}
function rematch(){
 if(role==='host'){state=E.newGame();history=[state];logs=[];last=null;done=false;winner=null;reason='';clockInit();notice='新しい対局を開始しました。';sendSnapshot();render();}
 else if(conn?.open){conn.send({t:'rematch'});notice='再戦希望を伝えました。';render();}
}
root.addEventListener('click',e=>{
 const b=e.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='create')return openHost();
 if(a==='join')return openGuest(document.getElementById('join-code')?.value);
 if(a==='back')return back();
 if(a==='reconnect'&&role==='guest')return openGuest(room);
 if(a==='cell')return tapSquare(Number(b.dataset.square));
 if(a==='hand'){if(!linked||done||pending||state.turn!==side)return;selected=selected?.type==='hand'&&selected.t===b.dataset.piece?null:{type:'hand',t:b.dataset.piece};render();return;}
 if(a==='promotion'){const m=promotion?.find(x=>!!x.promote===(b.dataset.value==='yes'));if(m){promotion=null;move(m);}return;}
 if(a==='resign'){modal='resign';render();return;}
 if(a==='confirm-resign')return resign();
 if(a==='help'){modal='help';render();return;}
 if(a==='close'){modal='';render();return;}
 if(a==='rematch')return rematch();
 if(a==='copy'){
  const fallback=()=>{const inp=document.getElementById('room-code-display');if(inp){inp.select();document.execCommand('copy');}};
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(room).catch(fallback);else fallback();
  notice='部屋コードをコピーしました。';render();return;
 }
});
root.addEventListener('change',e=>{if(e.target?.id==='nickname'){saveName();render();}});
window.ShogiOnlineDebug={getState:()=>state,getRole:()=>role,getRoom:()=>room,isConnected:()=>linked,getName:()=>name,getClock:()=>({limit:clockLimit,remaining:{...clockRemaining},shown:{1:clockShow(1),'-1':clockShow(-1)},done,winner}),normalizeRoomCode};
const incoming=roomFromURL();if(incoming)openGuest(incoming);else render();
})();
</script></body></html>
